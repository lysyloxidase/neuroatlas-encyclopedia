structure_id: L1_LOBE_PARIETAL
names:
  latin: Lobus parietalis
  english: Parietal lobe
  abbreviations:
    - PL
level: 1
macroanatomy:
  category: lobe
  boundaries: Posterior to the central sulcus, superior to the lateral sulcus, and anterior to the
    parieto-occipital boundary.
  subdivisions:
    - postcentral gyrus
    - superior parietal lobule
    - supramarginal gyrus
    - angular gyrus
    - precuneus
  color: "#22c55e"
atlas_links:
  crosswalks: []
location:
  neighbors: []
  parent: null
  children: []
cytoarchitecture:
  layers: Macroanatomical entry; cellular details resolve in Level 2 and Level 3 pages.
  cell_classes:
    excitatory:
      - IT
      - ET
      - CT
      - L6b
    inhibitory:
      - PV
      - SST
      - VIP
      - LAMP5
      - SNCG
    glia:
      - astrocyte
      - oligodendrocyte
      - microglia
inputs:
  afferent_cortical:
    - association cortex
    - primary and secondary cortical fields
  afferent_subcortical:
    - thalamus
    - basal ganglia and cerebellar loops
  afferent_modulatory:
    - dopamine
    - serotonin
    - norepinephrine
    - acetylcholine
outputs:
  efferent_cortical:
    - local cortical and association networks
  efferent_subcortical:
    - thalamus
    - basal ganglia
    - brainstem
    - cerebellum
functions:
  - claim: Somatosensation, spatial attention, left praxis, calculation, and body image are robust parietal lobe
      functions.
    tier: 1
    tier_justification: Robust clinical lesion, stimulation, atlas, and systems-neuroscience evidence converge at
      the macroanatomical level.
    citations:
      - doi: 10.1016/j.neuroimage.2006.01.021
        year: 2006
        journal: NeuroImage
        title: An automated labeling system for subdividing the human cerebral cortex on MRI scans
neurotransmitters:
  intrinsic:
    - glutamate
    - GABA
  modulatory:
    - dopamine
    - serotonin
    - norepinephrine
    - acetylcholine
disorders:
  - disorder: hemineglect
    association: Right parietal injury robustly causes contralesional spatial neglect.
    effect_size: 0.45
    tier: 1
    citations:
      - doi: 10.1016/j.neuroimage.2006.01.021
        year: 2006
        journal: NeuroImage
        title: An automated labeling system for subdividing the human cerebral cortex on MRI scans
  - disorder: Gerstmann syndrome
    association: Left angular-region injury can produce acalculia, agraphia, finger agnosia, and left-right confusion.
    effect_size: 0.45
    tier: 1
    citations:
      - doi: 10.1016/j.neuroimage.2006.01.021
        year: 2006
        journal: NeuroImage
        title: An automated labeling system for subdividing the human cerebral cortex on MRI scans
  - disorder: Balint syndrome
    association: Bilateral parietal-occipital injury can cause simultanagnosia, optic ataxia, and ocular apraxia.
    effect_size: 0.45
    tier: 1
    citations:
      - doi: 10.1016/j.neuroimage.2006.01.021
        year: 2006
        journal: NeuroImage
        title: An automated labeling system for subdividing the human cerebral cortex on MRI scans
imaging:
  t1_signal: Parietal lobe is identifiable as a Level 1 macroanatomical landmark on structural MRI or atlas surfaces.
  fmri_tasks:
    - resting state
    - task localizer
development:
  embryonic_origin: Neural tube-derived central nervous system territory.
  peak_synaptogenesis: Region-specific prenatal and postnatal maturation.
  myelination: Maturation follows local circuit and long-range tract development.
