functions:
  - claim: Executive function, motor control, left language production, and personality are core frontal lobe
      functions.
    tier: 1
    tier_justification: Robust clinical lesion, stimulation, atlas, and systems-neuroscience evidence converge at
      the macroanatomical level.
    citations:
      - doi: 10.1093/med/9780199837755.001.0001
        year: 2013
        journal: Oxford Medicine Online
        title: Principles of Frontal Lobe Function
neurotransmitters:
  intrinsic:
    - glutamate
    - GABA
  modulatory:
    - dopamine
    - serotonin
    - norepinephrine
    - acetylcholine
disorders:
  - disorder: frontal lobe syndrome
    association: Dysexecutive, disinhibited, apathetic, or personality-change syndromes follow frontal injury.
    effect_size: 0.45
    tier: 1
    citations:
      - doi: 10.1093/med/9780199837755.001.0001
        year: 2013
        journal: Oxford Medicine Online
        title: Principles of Frontal Lobe Function
  - disorder: behavioral variant frontotemporal dementia
    association: bvFTD prominently affects frontal and anterior temporal systems.
    effect_size: 0.45
    tier: 1
    citations:
      - doi: 10.1093/med/9780199837755.001.0001
        year: 2013
        journal: Oxford Medicine Online
        title: Principles of Frontal Lobe Function
  - disorder: Pick disease
    association: Frontotemporal degeneration classically involves frontal and temporal cortex.
    effect_size: 0.45
    tier: 1
    citations:
      - doi: 10.1093/med/9780199837755.001.0001
        year: 2013
        journal: Oxford Medicine Online
        title: Principles of Frontal Lobe Function
imaging:
  t1_signal: Frontal lobe is identifiable as a Level 1 macroanatomical landmark on structural MRI or atlas surfaces.
  fmri_tasks:
