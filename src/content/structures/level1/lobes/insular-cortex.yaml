functions:
  - claim: Interoception, salience processing, taste, autonomic control, and pain affect are robust insular
      functions.
    tier: 1
    tier_justification: Robust clinical lesion, stimulation, atlas, and systems-neuroscience evidence converge at
      the macroanatomical level.
    citations:
      - doi: 10.1016/j.neuron.2007.05.011
        year: 2007
        journal: Neuron
        title: Dissociable intrinsic connectivity networks for salience processing and executive control
neurotransmitters:
  intrinsic:
    - glutamate
    - GABA
  modulatory:
    - dopamine
    - serotonin
    - norepinephrine
    - acetylcholine
disorders:
  - disorder: frontotemporal dementia salience-network dysfunction
    association: Anterior insula and cingulate vulnerability is prominent in salience-network degeneration.
    effect_size: 0.45
    tier: 1
    citations:
      - doi: 10.1016/j.neuron.2007.05.011
        year: 2007
        journal: Neuron
        title: Dissociable intrinsic connectivity networks for salience processing and executive control
  - disorder: addiction
    association: Insular injury and activity can alter craving and addictive behavior.
    effect_size: 0.45
    tier: 1
    citations:
      - doi: 10.1016/j.neuron.2007.05.011
        year: 2007
        journal: Neuron
        title: Dissociable intrinsic connectivity networks for salience processing and executive control
imaging:
  t1_signal: Insular cortex is identifiable as a Level 1 macroanatomical landmark on structural MRI or atlas surfaces.
