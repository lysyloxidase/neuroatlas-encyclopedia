structure_id: L1_LOBE_OCCIPITAL
names:
  latin: Lobus occipitalis
  english: Occipital lobe
  abbreviations:
    - OL
level: 1
macroanatomy:
  category: lobe
  boundaries: Posterior cortical pole surrounding calcarine, cuneus, lingual, and lateral occipital visual territories.
  subdivisions:
    - V1 BA17
    - V2 BA18
    - V3/V4/V5 BA19
    - cuneus
    - lingual gyrus
    - lateral occipital cortex
  color: "#a855f7"
