functions:
  - claim: Vision is the defining robust function of the occipital lobe.
    tier: 1
    tier_justification: Robust clinical lesion, stimulation, atlas, and systems-neuroscience evidence converge at
      the macroanatomical level.
    citations:
      - doi: 10.1016/j.neuroimage.2006.01.021
        year: 2006
        journal: NeuroImage
        title: An automated labeling system for subdividing the human cerebral cortex on MRI scans
neurotransmitters:
  intrinsic:
    - glutamate
    - GABA
  modulatory:
    - dopamine
    - serotonin
    - norepinephrine
    - acetylcholine
disorders:
  - disorder: cortical blindness
    association: Bilateral primary visual cortex injury causes cortical blindness.
    effect_size: 0.45
    tier: 1
    citations:
      - doi: 10.1016/j.neuroimage.2006.01.021
        year: 2006
        journal: NeuroImage
        title: An automated labeling system for subdividing the human cerebral cortex on MRI scans
  - disorder: prosopagnosia
    association: Ventral occipital-temporal injury can impair face recognition.
    effect_size: 0.45
    tier: 1
    citations:
      - doi: 10.1016/j.neuroimage.2006.01.021
        year: 2006
        journal: NeuroImage
        title: An automated labeling system for subdividing the human cerebral cortex on MRI scans
  - disorder: achromatopsia
    association: Ventral visual cortex injury can impair color perception.
    effect_size: 0.45
    tier: 1
    citations:
      - doi: 10.1016/j.neuroimage.2006.01.021
        year: 2006
        journal: NeuroImage
        title: An automated labeling system for subdividing the human cerebral cortex on MRI scans
imaging:
  t1_signal: Occipital lobe is identifiable as a Level 1 macroanatomical landmark on structural MRI or atlas surfaces.
  fmri_tasks:
