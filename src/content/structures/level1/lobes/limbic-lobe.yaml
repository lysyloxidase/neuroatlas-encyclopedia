functions:
  - claim: The limbic lobe is a useful system-level view for memory, autonomic, and affective circuits, but not a
      strict emotion-center lobe.
    tier: 2
    tier_justification: The anatomy is historically useful, while modern circuit evidence rejects a single limbic emotion center.
    citations:
