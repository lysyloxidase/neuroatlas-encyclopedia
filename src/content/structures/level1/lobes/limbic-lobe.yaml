structure_id: L1_LOBE_LIMBIC
names:
  latin: Grand lobe limbique
  english: Limbic lobe
  abbreviations:
    - limbic system view
level: 1
macroanatomy:
  category: lobe
  boundaries: Medial cortical ring including cingulate, parahippocampal, and subcallosal territories.
  subdivisions:
    - cingulate gyrus
    - parahippocampal gyrus
    - subcallosal area
  note: Broca's limbic lobe is shown as a toggleable system view. LeDoux argues against treating the limbic
    system as a unitary emotion center.
  color: "#eab308"
  system_view_tier: 2
