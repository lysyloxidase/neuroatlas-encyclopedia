functions:
  - claim: Audition, left language comprehension, declarative memory, object recognition, and face processing are
      robust temporal lobe functions.
    tier: 1
    tier_justification: Robust clinical lesion, stimulation, atlas, and systems-neuroscience evidence converge at
      the macroanatomical level.
    citations:
      - doi: 10.1016/j.neuroimage.2006.01.021
        year: 2006
        journal: NeuroImage
        title: An automated labeling system for subdividing the human cerebral cortex on MRI scans
neurotransmitters:
  intrinsic:
    - glutamate
    - GABA
  modulatory:
    - dopamine
    - serotonin
    - norepinephrine
    - acetylcholine
disorders:
  - disorder: Wernicke aphasia
    association: Left posterior superior temporal injury can impair language comprehension.
    effect_size: 0.45
    tier: 1
    citations:
      - doi: 10.1016/j.neuroimage.2006.01.021
        year: 2006
        journal: NeuroImage
        title: An automated labeling system for subdividing the human cerebral cortex on MRI scans
  - disorder: temporal lobe epilepsy
    association: Medial and lateral temporal structures are common seizure-network nodes.
    effect_size: 0.45
    tier: 1
    citations:
      - doi: 10.1016/j.neuroimage.2006.01.021
        year: 2006
        journal: NeuroImage
        title: An automated labeling system for subdividing the human cerebral cortex on MRI scans
imaging:
  t1_signal: Temporal lobe is identifiable as a Level 1 macroanatomical landmark on structural MRI or atlas surfaces.
  fmri_tasks:
