structure_id: L1_LOBE_TEMPORAL
names:
  latin: Lobus temporalis
  english: Temporal lobe
  abbreviations:
    - TL
level: 1
macroanatomy:
  category: lobe
  boundaries: Inferior to the lateral sulcus and extending from the temporal pole to posterior temporal
    association cortex.
  subdivisions:
    - superior temporal gyrus
    - middle temporal gyrus
    - inferior temporal gyrus
    - fusiform gyrus
    - parahippocampal gyrus
    - hippocampus
    - amygdala
    - entorhinal cortex
  color: "#f97316"
