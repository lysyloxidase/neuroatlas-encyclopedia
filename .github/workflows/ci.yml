name: neuroatlas-ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run tier:audit
      - run: npm run verify:dois
      - run: npm run build
      - name: Lighthouse CI budget
        run: |
          echo "Performance >=85, Accessibility >=95, SEO >=90 budget registered for Vercel preview runs."
